
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Focusly is a minimalist Pomodoro timer to help you focus and stay productive.">

    <title>Focusly — Stay Focused</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">focusly<span>.</span></a>

        <nav class="navigation">
            <a href="#timer">Timer</a>
            <a href="#statistics">Statistics</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">FOCUS ON WHAT MATTERS</p>
            <h1>Make time for<br>what <span>matters.</span></h1>
            <p class="description">
                A little focus goes a long way.
                Take control of your time, one session at a time.
            </p>
        </section>

        <section class="timer-card" id="timer">
            <div class="timer-modes">
                <button class="mode-btn active" data-mode="focus">
                    Focus
                </button>

                <button class="mode-btn" data-mode="short">
                    Short Break
                </button>

                <button class="mode-btn" data-mode="long">
                    Long Break
                </button>
            </div>

            <div class="timer-display">
                <span id="timer">25:00</span>
            </div>

            <p class="session-label" id="session-label">
                SESSION 01 · TIME TO FOCUS
            </p>

            <div class="timer-controls">
                <button class="start-btn" id="start-btn">
                    Start Focus
                </button>

                <button class="reset-btn" id="reset-btn">
                    Reset
                </button>
            </div>
        </section>

        <section class="statistics" id="statistics">
            <article class="stat-card">
                <h2 id="total-focus">0 min</h2>
                <p>Total Focus Time</p>
            </article>

            <article class="stat-card">
                <h2 id="completed-sessions">0</h2>
                <p>Sessions Completed</p>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>Made with focus by Focusly.</p>
    </footer>
</body>
</html>
